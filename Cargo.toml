[package]
name = "bkash-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Native Rust reimplementation of the bKash Android client - runs on Linux, Windows and macOS with no emulator. Includes a dependency-free Dart AOT snapshot decoder and ELF artifact analyzer."
keywords = ["bkash", "desktop", "rust", "no-emulator", "reverse-engineering", "dart-aot", "flutter", "egui", "bangladesh", "elf", "reimplementation"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/NurMohammadDuari/bkash-desktop"
repository = "https://github.com/NurMohammadDuari/bkash-desktop"
documentation = "https://github.com/NurMohammadDuari/bkash-desktop/tree/main/docs"
readme = "README.md"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "charset",
    "http2",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
aes = "0.9"
cbc = "0.2"
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10.9"
rand = "0.9.5"
base64 = "0.23.1"
thiserror = "2.0.20"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "x11", "glow"] }
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
