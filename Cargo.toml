[package]
name = "bkash-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Native Rust port scaffold for bKash 7.3.5 (com.bKash.customerapp) + offline AOT/ELF artifact analyzer"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "charset",
    "http2",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
aes = "0.9"
cbc = "0.2"
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10.9"
rand = "0.9.5"
base64 = "0.23.1"
thiserror = "2.0.20"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "x11", "glow"] }
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
